# Mirror Maker 2 Configuration
# Replicates data from main Kafka cluster (kafka1-3) to backup broker

# Cluster aliases
clusters = source, target

# Source cluster configuration (main Kafka cluster)
source.bootstrap.servers = kafka:9092,kafka2:9092,kafka3:9092
source.security.protocol = PLAINTEXT

# Target cluster configuration (backup Kafka broker)
target.bootstrap.servers = kafka-backup:9092
target.security.protocol = PLAINTEXT

# Replication flows
source->target.enabled = true
target->source.enabled = false

# Topics to replicate (use regex patterns)
source->target.topics = .*
# Exclude internal topics and MM2 topics to avoid loops
source->target.topics.blacklist = .*[\-\.]internal, .*\.replica, __consumer_offsets, __transaction_state, _schemas, connect-configs, connect-offsets, connect-status, mm2-.*

# Replication settings (backup broker is single-node)
source->target.replication.factor = 1
source->target.offset-syncs.topic.replication.factor = 1
source->target.heartbeats.topic.replication.factor = 1
source->target.checkpoints.topic.replication.factor = 1

# Consumer group settings
source->target.sync.group.offsets.enabled = true
source->target.sync.group.offsets.interval.seconds = 60
source->target.emit.checkpoints.enabled = true
source->target.emit.checkpoints.interval.seconds = 60

# Topic creation settings (backup broker is single-node)
source->target.topic.creation.enable = true
source->target.topic.creation.default.replication.factor = 1
source->target.topic.creation.default.partitions = 3

# Connect worker configuration
bootstrap.servers = kafka:9092,kafka2:9092,kafka3:9092
key.converter = org.apache.kafka.connect.storage.StringConverter
value.converter = org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable = false

# Connect cluster configuration
group.id = mm2-cluster
config.storage.topic = mm2-configs
config.storage.replication.factor = 3
offset.storage.topic = mm2-offsets
offset.storage.replication.factor = 3
status.storage.topic = mm2-status
status.storage.replication.factor = 3

# Connect internal settings
internal.key.converter = org.apache.kafka.connect.json.JsonConverter
internal.value.converter = org.apache.kafka.connect.json.JsonConverter
internal.key.converter.schemas.enable = false
internal.value.converter.schemas.enable = false

# Timeouts and retries
request.timeout.ms = 60000
retry.backoff.ms = 1000
reconnect.backoff.ms = 1000
reconnect.backoff.max.ms = 10000

# Refresh settings
refresh.topics.enabled = true
refresh.topics.interval.seconds = 600
refresh.groups.enabled = true
refresh.groups.interval.seconds = 600

# Logging
connect.log4j.loggers = org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR
